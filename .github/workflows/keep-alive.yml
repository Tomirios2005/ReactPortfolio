name: Mantener Edge Function Activa

on:
  schedule:
    # Se ejecuta a las 00:00 cada domingo y miércoles (2 veces por semana)
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # Te permite probarlo manualmente desde GitHub cuando quieras

jobs:
  ping-portfolio-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Simular prompt de usuario
        run: |
          curl -X POST "https://iijyrqhrqkpgyjtdxzik.supabase.co/functions/v1/portfolio-bot" \
          -H "Content-Type: application/json" \
          -d '{"messages": [{"role": "user", "content": "ping para mantener activo"}]}'
